<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Donghoon Ko</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
        
      display: flex;
      justify-content: center;
      align-items: center;

      background-color: #ffffff;
      color: #111111;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .intro {
      width: min(700px, 85%);
    }

    .intro-title {
      margin-bottom: 24px;

      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 1.05;

      opacity: 0;
      transform: translateY(30px);

      animation: fadeInUp 1.2s ease forwards;
      animation-delay: 0.3s;
    }

    .intro-description {
      max-width: 580px;

      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 400;
      line-height: 1.8;

      color: #666666;

      opacity: 0;
      transform: translateY(20px);

      animation: fadeInUp 1.2s ease forwards;
      animation-delay: 1s;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro-title,
      .intro-description {
        opacity: 1;
        transform: none;
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="intro">
    <h1 class="intro-title">
      Hi, I'm Donghoon Ko.
    </h1>

    <p class="intro-description">
      I study artificial intelligence, information theory,
      and communication systems.
    </p>
  </main>
</body>
</html>
